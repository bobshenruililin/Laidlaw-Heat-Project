# Audited by scripts/79_covid_period_rails_checks.py. This schema uses `numerals:`,
# so scripts/50_audit_live_claim_ledger.py cannot read it: pointed here it reports a
# vacuous one-check pass. The 12 September repair moved no numeral; it added display
# strings for the influence months and the reference, figure, and print bindings below.

