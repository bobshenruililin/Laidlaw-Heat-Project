<text x="24" y="460" font-size="12" fill="#5b6773">Teal = P(ERA5 dry-bulb ≥ 28°C). Marker area scales with bin count. Axis labels sit in the margin. Apparent temperature is omitted here because it is already ~1 once Headquarters is ≥ 28°C.</text>
<text x="24" y="480" font-size="12" fill="#5b6773">Among station nights ≥ 29.5°C, ERA5 still agrees only 44% of the time (unconditional P among official hot nights = 0.031). Not a health finding. Not a daily admissions model.</text>
