# Machine-readable pathway registry
# Consumed by scripts/20_fit_pathway_panel.R

version: 2
study_window: ["2013-01", "2023-12"]
outcome_default: cvd_first_hospitalisation_proxy
family_default: negative_binomial
offset: "log(population * days_in_month)"
headline_proposal: ["P02", "P04"]
amended_core_candidates: ["P01A", "P02A", "P02B", "P04A", "P04B", "P04C"]
amendment_note: "A1 (7 Aug 2026): separate single-exposure models added after diagnostics/collinearity audit; exploratory until team Gate 3."

controls_core:
  - month_f          # calendar month factor (seasonality)
  - time_spline      # ns(time_index, df = modeling.time_trend_df)

controls_optional:
  covid_phase: true
  absolute_humidity: false
  public_holiday_days: false
  chinese_new_year_month: false

pathways:
  P01:
    title: Continuous same-month mean temperature
    enabled: true
    grain: auto  # territory or age_sex if available
    exposures: [mean_temp]
    scale: null
    extras: []
    literature: [goggins2012stroke, gasparrini2015lancet]
  P01A:
    title: Continuous same-month mean temperature (days-only offset)
    enabled: true
    grain: auto
    exposures: [mean_temp]
    scale: null
    extras: []
    role: amended_single_exposure
    offset: days_only
    literature: [goggins2012stroke, gasparrini2015lancet]
  P02:
    title: Continuous same-month Tmax and Tmin
    enabled: true
    grain: auto
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: []
    role: exploratory_joint
    offset: population_x_days
    literature: [bishai_email_2026_07_12]
  P02A:
    title: Continuous same-month Tmax alone
    enabled: true
    grain: auto
    exposures: [mean_tmax]
    scale: null
    extras: []
    role: amended_single_exposure
    offset: days_only
    literature: [bishai_email_2026_07_12]
  P02B:
    title: Continuous same-month Tmin alone
    enabled: true
    grain: auto
    exposures: [mean_tmin]
    scale: null
    extras: []
    role: amended_single_exposure
    offset: days_only
    literature: [bishai_email_2026_07_12]
  P03:
    title: Lag-1 month temperature
    enabled: true
    grain: auto
    exposures: [lag1_mean_tmax, lag1_mean_tmin]
    scale: null
    extras: []
    literature: []
  P04:
    title: Official extreme-day counts
    enabled: true
    grain: auto
    exposures: [hot_nights, cold_days, very_hot_days]
    scale: 5
    extras: []
    role: exploratory_joint
    offset: population_x_days
    literature: [guo2024hotnights]
  P04A:
    title: Hot-night count alone
    enabled: true
    grain: auto
    exposures: [hot_nights]
    scale: 5
    extras: []
    role: amended_single_exposure
    offset: days_only
    literature: [guo2024hotnights]
  P04B:
    title: Cold-day count alone
    enabled: true
    grain: auto
    exposures: [cold_days]
    scale: 5
    extras: []
    role: amended_single_exposure
    offset: days_only
    literature: [goggins2012stroke, wang2025coldfluStroke]
  P04C:
    title: Very-hot-day count alone
    enabled: true
    grain: auto
    exposures: [very_hot_days]
    scale: 5
    extras: []
    role: amended_single_exposure
    offset: days_only
    literature: [guo2024hotnights]
  P05:
    title: Ren/Wang spell burden
    enabled: true
    grain: auto
    exposures: [days_in_hot_night_spell_ge5, days_in_very_hot_spell_ge5]
    scale: null
    extras: []
    literature: [wang2019ehwe]
  P06:
    title: Combined day-night 2D3N burden
    enabled: true
    grain: auto
    exposures: [days_in_2d3n_window]
    scale: null
    extras: []
    literature: [wang2019ehwe]
  P07:
    title: Heatwave-month indicators (multi-percentile + spells)
    enabled: true
    grain: auto
    exposures: [hw_month_mean_temp_ge_p90, hw_month_mean_temp_ge_p95, hw_month_mean_temp_ge_p975, hw_month_has_vhd_spell_ge3]
    scale: null
    extras: []
    role: exploratory_nested_joint
    offset: population_x_days
    literature: [guo2017ehp_heatwave, liu2026medrxiv_hw_mortality]
  P07A:
    title: Mean-temperature p90 heat month alone
    enabled: true
    grain: auto
    exposures: [hw_month_mean_temp_ge_p90]
    scale: null
    extras: []
    role: amended_separate_definition
    offset: days_only
    literature: [guo2017ehp_heatwave, liu2026medrxiv_hw_mortality]
  P07B:
    title: Mean-temperature p95 heat month alone
    enabled: true
    grain: auto
    exposures: [hw_month_mean_temp_ge_p95]
    scale: null
    extras: []
    role: amended_separate_definition
    offset: days_only
    literature: [guo2017ehp_heatwave, liu2026medrxiv_hw_mortality]
  P07C:
    title: Mean-temperature p97.5 heat month alone
    enabled: true
    grain: auto
    exposures: [hw_month_mean_temp_ge_p975]
    scale: null
    extras: []
    role: amended_separate_definition
    offset: days_only
    literature: [guo2017ehp_heatwave, liu2026medrxiv_hw_mortality]
  P07D:
    title: Very-hot-day spell heat month alone
    enabled: true
    grain: auto
    exposures: [hw_month_has_vhd_spell_ge3]
    scale: null
    extras: []
    role: amended_separate_definition
    offset: days_only
    literature: [guo2017ehp_heatwave, liu2026medrxiv_hw_mortality]
  P08:
    title: Cold-side primary
    enabled: true
    grain: auto
    exposures: [cold_days, max_cold_spell_touching]
    scale: null
    extras: []
    literature: [goggins2012stroke, wang2025coldfluStroke]
  P09:
    title: Age-stratified (65+ vs younger)
    enabled: true
    grain: age_sex_required
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: [age_band65]
    literature: []
  P10:
    title: COVID and holiday sensitivity on P02
    enabled: true
    grain: auto
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: [covid_phase, public_holiday_days, chinese_new_year_month]
    literature: []
  P11:
    title: Pollution-staged on P02
    enabled: true
    grain: auto
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: [pollution_staged]
    literature: [goggins2013, guo2025tempPollution]
  P12:
    title: Absolute humidity sensitivity on P02
    enabled: true
    grain: auto
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: [absolute_humidity]
    literature: []
  P13:
    title: Subtype split IS vs HS
    enabled: false  # enable when subtype present
    grain: auto
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: [subtype_strata]
    literature: [goggins2012stroke]
  P14:
    title: Flu co-exposure
    enabled: true
    grain: auto
    exposures: [mean_tmax, cold_days]
    scale: null
    extras: [flu_indicator]
    literature: [wang2025coldfluStroke]
  P15:
    title: Temperature variability proxy
    enabled: true
    grain: auto
    exposures: [temp_variability_mean_range]
    scale: null
    extras: []
    literature: [tv_hospitalisation_hk]
  P16:
    title: Pre-COVID only (P02)
    enabled: true
    grain: auto
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: [pre_covid_only]
    literature: []
  P17:
    title: Sex interaction on Tmax (age-sex grain)
    enabled: true
    grain: age_sex_required
    exposures: [mean_tmax, mean_tmin]
    scale: null
    extras: [sex_strata]
    literature: [goggins2012stroke]
  P18:
    title: Cold-month indicator (p05 Tmean)
    enabled: true
    grain: auto
    exposures: [cold_month_mean_temp_le_p05, cold_days]
    scale: null
    extras: []
    literature: [wang2025coldfluStroke, goggins2012stroke]
