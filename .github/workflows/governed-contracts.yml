name: Synthetic R model contracts
on:
  pull_request:
    paths:
      - '.github/workflows/governed-contracts.yml'
      - 'scripts/cvd_rerun_contracts.R'
      - 'scripts/08c_qc_cvd_aggregates.R'
      - 'scripts/23_pathway_diagnostics.R'
      - 'scripts/27_cvd_descriptives_real.R'
      - 'scripts/31_cvd_core_robustness.R'
      - 'scripts/32_cvd_trend_depletion_lag.R'
      - 'scripts/83_covid_common_basis_interactions.R'
      - 'tests/test_governed_contracts.R'
      - 'tests/test_covid_common_basis_interactions.R'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install model packages and record versions
        run: |
          Rscript -e 'install.packages(c("sandwich","tscount")); stopifnot(all(vapply(c("MASS","sandwich","tscount"), requireNamespace, logical(1), quietly=TRUE))); sessionInfo()'
      - run: Rscript tests/test_governed_contracts.R
      - run: Rscript tests/test_covid_common_basis_interactions.R
