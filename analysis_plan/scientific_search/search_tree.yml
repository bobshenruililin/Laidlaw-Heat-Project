# Persistent scientific-search tree. Does not reset when a paper or chat ends.
# Status: alive | blocked_human | killed | closed_lemma | queued
# Kill only with a table contradiction or a forbidden-claim hit.
# success_metric must never be a thermal discovery, a confirmatory primary, or a filled human gate.

lab: heat_chd_hf_scientific_search
updated: 2026-08-24
inherits_from: analysis_plan/auto_research/approach_registry.yml
objective: identification_defensibility
compounding: true

rails:
