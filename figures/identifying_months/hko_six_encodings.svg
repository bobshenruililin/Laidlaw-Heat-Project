<text x="318.1" y="97.0" font-size="11" fill="#12181f">4% · 12 months</text>
<text x="268" y="147.3" text-anchor="end" font-size="12">Mean Tmax</text>
<rect x="280" y="122.3" width="37.7" height="40.3" fill="#5b6773" fill-opacity="0.85"/>
<text x="325.7" y="147.3" font-size="11" fill="#12181f">5% · 12 months</text>
