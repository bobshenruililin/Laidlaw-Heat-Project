    status: blocked_human
    blocked_reason: "Stroke file not attached; still-at-risk person-time not delivered."
    job: "Schema, QC, and first-hour checklist for the hour a governed file arrives. No rows, no coefficients."
    must_not_collapse_into: "Invented stroke coefficients or incidence language from a days-in-month offset."
    kill_only_with:
