    status: alive
    job: "Hold Goggins AMI/HF, Guo official vs hourly hot nights, and both Liu mortality layers as distinct estimands."
    must_not_collapse_into: "Rescaling 2.63 or 3.1% onto 1.073 / 1.022, or treating mortality AF as monthly morbidity."
    kill_only_with:
      - table_contradiction
      - forbidden_claim_hit
    primary_files:
      - literature/jasmine_liu2020_confirmed.md
      - literature/roro_manuscript_deep_read.md
      - manuscript/live_collaborative/claim_ledger.md

  weather_lock_readiness:
    id: F04
    status: blocked_human
    blocked_reason: "Hogan has not written the definition lock. A blank Tuesday sheet is not evidence."
    job: "Playbook 01 packet for HM23 / CM05 / official counts: pending vs already in the registry. No fake lock."
    must_not_collapse_into: "Locking definitions Hogan has not written, or calling a weather nomination Gate 3."
    kill_only_with:
      - table_contradiction
      - forbidden_claim_hit
    owner: Hogan
    primary_files:
