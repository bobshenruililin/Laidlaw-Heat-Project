name: Reproduce public research
on:
  pull_request:
    paths:
      - 'research_lab/**'
      - 'outputs/tables/cvd_*.csv'
      - 'data_processed/climate_monthly_2013_2023.csv'
      - 'data_raw/hko/**'
      - 'manuscript/covid_period/november/**'
      - '.github/workflows/research-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research_lab/requirements.txt
      - run: python -m unittest discover -s research_lab/tests -v
      - run: python -m research_lab check
      - run: python manuscript/covid_period/november/build.py check
