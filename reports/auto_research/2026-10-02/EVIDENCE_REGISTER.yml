rival_families:
- name: Entry/risk-set and extraction change
  prediction: Count movement tracks eligibility, entry/exit, look-back or query changes; stable-risk-set
    analyses may differ.
  needed: Query provenance and dynamic denominators.
  current_discrimination: not available
- name: Utilisation/recording and competing mortality
  prediction: Contacts/admissions fall while delayed presentation, severity or out-of-hospital death rises;
    patterns may track service restrictions.
  needed: Service, diagnosis and mortality linkage; comparable definitions.
  current_discrimination: neighbouring evidence only
- name: Biological or co-exposure change
  prediction: Clinical risk/severity or infections/pollution change coherently beyond recording effects.
  needed: Specified clinical measures, co-exposure trajectories and defensible comparison.
  current_discrimination: not measured in delivered transfer
- name: Model/support/uncertainty artefact
  prediction: Coefficient movement follows basis, exposure support, influential months or covariance construction
    without biological modification.
  needed: Bounded diagnostics specified before looking at favourable outputs.
  current_discrimination: plausible; some existing sensitivities informative, not isolated
phase_2_gate: Choose a target; state rival predictions and rejection criteria; determine discriminating
  data feasibility. No causal manuscript promise or significance search. Descriptive narrowing, pivot
  or stop are acceptable.
