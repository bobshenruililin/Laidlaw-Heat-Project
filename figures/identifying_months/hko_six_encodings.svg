<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Georgia, serif">
<rect width="100%" height="100%" fill="#f4efe4"/>
<text x="24" y="28" font-size="16">What survives month indicators</text>
<text x="24" y="48" font-size="11" fill="#5b6773">Share of 132-month sum of squares that is between-year within calendar month. Exposure only. Not a health finding.</text>
<line x1="280" y1="72" x2="280" y2="364" stroke="#12181f"/>
<line x1="280" y1="364" x2="672" y2="364" stroke="#12181f"/>
