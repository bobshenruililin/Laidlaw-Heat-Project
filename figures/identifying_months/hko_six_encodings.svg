<text x="636.4" y="396" text-anchor="middle" font-size="11" fill="#5b6773">50%</text>
<text x="24" y="404" font-size="11" fill="#5b6773">Grey = monthly means (season already explains most of the series). Teal = official count flags. Live paper stays on Headquarters.</text>
