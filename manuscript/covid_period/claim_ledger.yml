# References are renumbered in Vancouver order of first appearance. Entries that the
# repaired body no longer cites were dropped from the main list rather than left
# unread; none of them was a fabricated citation.
references:
  numbering: vancouver_order_of_appearance
  n_entries: 23
  dropped_as_uncited:
    - Ye 2012 ambient temperature and morbidity review
    - Goggins 2012 daily stroke admissions
    - Yang 2025 cold weather, influenza, and stroke
    - Chevance 2024, Ioannou 2024, O'Connor 2025, Ashe 2025 (heat and sleep)
    - Ikaheimo 2018, Li 2026 (cold exposure physiology)
    - WHO 2026 heat-health action plan guidance
    - HKO and CHP heat and cold warning pages, Home Affairs heat shelters
    - HKO The Year's Weather 2017 and 2024
  kept_methods_citations:
    - Bhaskaran 2013 time series regression
    - Newey and West 1987
    - Benjamini and Hochberg 1995
    - Greenland and Morgenstern 1989
    - Basagana and Ballester 2024, 2026 (aggregation refusal)
    - HKO, EPD, and Census and Statistics Department sources
    - Goggins and Chan 2017 humidity, Chan 2013 rainfall

figures:
  - label: Figure 1
    file: figures/live_identification/figure_B_first_event_depletion.png
    role: first-event count path against general population
  - label: Figure 2
    file: figures/live_identification/figure_A_cold_day_identification.png
    role: which months carry the official cold-day contrast
  - label: Figure 3
    file: figures/live_identification/figure_D_trend_depletion_sensitivity.png
    role: main identification display across trend, window, and COVID-phase fits

print:
  builder: scripts/78_covid_period_manuscript_docx.py
  word: manuscript/covid_period/Heat_CVD_Manuscript_covid_period.docx
  pdf: manuscript/covid_period/Heat_CVD_Manuscript_covid_period.pdf
  page_map: manuscript/covid_period/PRINT_PAGE_MAP.md
  page_break_after_every_float: false
  do_not_run_for_this_track: scripts/77_hogan_20260910_live_docx.py
