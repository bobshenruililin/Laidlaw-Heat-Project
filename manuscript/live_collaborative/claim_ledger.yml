# Machine-checkable claim ledger for the 10 September live manuscript.
# Auditor: python3 scripts/50_audit_live_claim_ledger.py
# Provenance: HA_APPROVED_AGGREGATE, REAL, cited_paper, or manuscript_meta.

version: 2026-09-10
manuscript: manuscript/live_collaborative/Heat_CVD_Manuscript_live_update.md
human_ledger: manuscript/live_collaborative/claim_ledger.md

hogan_weather:
  must_contain: "Meteorological data was obtained from the HKO."
  also_must_contain:
    - "the number of hot nights"
    - "the number of very hot days"
    - "the number of extremely hot days"
    - "the number of cold days"
    - "Hong Kong Environmental Protection Department (EPD)"
    - "All monthly data were derived by taking the average of daily data in each calendar month."

forbidden_in_manuscript:
  - "Gate 3"
  - "health-econ"
  - "health improved"
  - "admissions averted"
  - "failing left ventricle"
  - "housing"
  - "medication"
  - "Hogan asked"
  - "work in progress"
  - "candidate article"
  - "SYNTHETIC_THEORY"
  - "F1.1"
  - "F1.2"

