<text x="24" y="460" font-size="12" fill="#5b6773">Blue = P(ERA5 dry-bulb ≤ 12°C). Marker area scales with bin count. Dashed line = official cold-day cut. Not a third public essay.</text>
<text x="24" y="480" font-size="12" fill="#5b6773">When Headquarters is already 8–12°C, ERA5 is ≤12°C on 99.2% of nights. Opposite bias to 28°C. Not a health finding.</text>
