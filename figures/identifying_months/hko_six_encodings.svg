<rect x="280" y="172.7" width="31.6" height="40.3" fill="#5b6773" fill-opacity="0.85"/>
<text x="319.6" y="197.7" font-size="11" fill="#12181f">4% · 12 months</text>
<text x="268" y="248.0" text-anchor="end" font-size="12">Hot nights ≥ 28°C</text>
<rect x="280" y="223.0" width="205.5" height="40.3" fill="#0c6b74" fill-opacity="0.85"/>
<text x="493.5" y="248.0" font-size="11" fill="#12181f">29% · 6 months</text>
