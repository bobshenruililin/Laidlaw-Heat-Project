# Approach families for Playbook 05. Group by scientific idea, not wording.
# An adversary may kill a family only with a table contradiction or a forbidden-claim hit.
# Status: alive | blocked_human | killed
# Do not collapse incompatible families into one attractive incomplete story.

lab: heat_chd_hf_auto_research
updated: 2026-09-02
stop_rule: identification_article_survives_audit_and_gaps_are_human_owned
do_not_copy_from_crouzeix:
  - assume_complete_affirmative_proof_exists
  - isolate_from_goggins_guo_liu_hogan_weather
  - unsupervised_search_for_a_new_coefficient

families:
  identification:
    id: F01
    status: alive
    job: "Show where monthly first-event information comes from: DJF concentration of official cold days, first-event depletion vs C&SD 35+, Newey–West ladder, pre-2020 window."
    must_not_collapse_into: "A discovery headline or a protected primary contrast."
    kill_only_with:
      - table_contradiction
      - forbidden_claim_hit
    primary_files:
      - manuscript/live_collaborative/Heat_CVD_Manuscript_live_update.md
      - outputs/live_identification/cold_days_by_month_year.csv
      - outputs/tables/cvd_descriptive_annual_totals.csv
      - outputs/release_chd_hf/tables/table4_uncertainty_ladder.csv
      - outputs/tables/cvd_trend_depletion_sensitivity.csv

  multiplicity_uncertainty:
    id: F02
    status: alive
    job: "Keep the twelve-contrast family visible. All core q > 0.19. Report Model, HC1, NW3, and NW6 without selecting the interval because it excludes 1."
    must_not_collapse_into: "Picking the interval that excludes 1, or treating q = 0.192 as multiplicity protection."
    kill_only_with:
      - table_contradiction
      - forbidden_claim_hit
    primary_files:
      - outputs/release_chd_hf/tables/table2_core_models.csv
      - outputs/release_chd_hf/tables/table4_uncertainty_ladder.csv
      - outputs/tables/chd_pathway_residual_acf.csv
      - outputs/tables/hf_pathway_residual_acf.csv

  local_daily_history:
